<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #ffe8f3, #fff8fb);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  padding: 20px 15px;
  position: relative;
}

.card {
  width: 100%;
  max-width: 650px;
  background: white;
  padding: 35px 25px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0, 0, 0, .15);
  animation: muncul 0.8s ease-out;
  z-index: 2;
  position: relative;
  max-height: 85vh;
  overflow-y: auto; /* Memastikan teks panjang bisa di-scroll dengan rapi di HP */
}

@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-family: 'Sacramento', cursive;
  font-size: 55px;
  color: #ff4f8b;
  margin-bottom: 10px;
  line-height: 1.2;
}

h2 {
  font-size: 20px;
  color: #444;
  margin-bottom: 20px;
}

p {
  font-size: 15px;
  line-height: 1.8;
  color: #555;
  margin-bottom: 25px;
  white-space: pre-line; /* Mempertahankan spasi dan enter teks */
}

button {
  padding: 14px 35px;
  border: none;
  border-radius: 50px;
  background: #ff4f8b;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: .3s;
  box-shadow: 0 4px 15px rgba(255, 79, 139, 0.4);
}

button:hover {
  transform: scale(1.05);
  background: #ff2f74;
}

.heart {
  position: fixed;
  top: -50px;
  font-size: 25px;
  animation: jatuh linear infinite;
  opacity: .7;
  pointer-events: none;
  z-index: 1;
}

@keyframes jatuh {
  0% {
    transform: translateY(-100px) rotate(0deg);
  }
  100% {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>

</head>
