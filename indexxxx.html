<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ffd1dc, #ffe6ee, #fff5f8);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  padding: 20px 15px;
  position: relative;
}

/* Card Utama */
.card {
  width: 100%;
  max-width: 600px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 35px 25px;
  border-radius: 30px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(255, 105, 135, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.8);
  z-index: 2;
  position: relative;
  max-height: 85vh;
  overflow-y: auto;
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-family: 'Sacramento', cursive;
  font-size: 52px;
  color: #ff4f8b;
  margin-bottom: 5px;
  line-height: 1.2;
}

h2 {
  font-size: 18px;
  color: #666;
  font-weight: 400;
  margin-bottom: 20px;
}

p {
  font-size: 14px;
  line-height: 1.8;
  color: #4a4a4a;
  margin-bottom: 20px;
  white-space: pre-line;
}

/* Form Pin / Password */
.pin-box {
  margin: 20px 0;
}

input[type="password"] {
  width: 180px;
  padding: 12px;
  text-align: center;
  font-size: 20px;
  letter-spacing: 5px;
  border: 2px solid #ffb6c1;
  border-radius: 25px;
  outline: none;
  background: #fff0f5;
  color: #ff4f8b;
  transition: 0.3s;
}

input[type="password"]:focus {
  border-color: #ff4f8b;
  box-shadow: 0 0 10px rgba(255, 79, 139, 0.3);
}

.hint-text {
  font-size: 13px;
  color: #e63946;
  margin-top: 10px;
  font-style: italic;
  display: none;
}

/* Frame Foto Estetik */
.photo-frame {
  width: 180px;
  height: 180px;
  margin: 0 auto 20px auto;
  border-radius: 50%;
  padding: 8px;
  background: linear-gradient(45deg, #ff4f8b, #ffb6c1);
  box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid white;
}

button {
  padding: 13px 32px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #ff4f8b, #ff75a0);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(255, 77, 141, 0.3);
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(255, 77, 141, 0.4);
}

/* Animasi Hati Jatuh */
.heart {
  position: fixed;
  top: -50px;
  font-size: 22px;
  animation: jatuh linear infinite;
  opacity: .7;
  pointer-events: none;
  z-index: 1;
}

@keyframes jatuh {
  0% { transform: translateY(-100px) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}
</style>
</head>
